<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Color Boxes & Greeting</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f4f6f9;
      padding: 20px;
    }

    .container {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 450px;
      text-align: center;
    }

    #greetingHeader {
      font-size: 28px;
      color: #333;
      margin-bottom: 25px;
    }

    .boxes-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 25px;
    }

    .box {
      height: 90px;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 2px solid #ccc;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      text-transform: capitalize;
      cursor: pointer;
      background-color: #fafafa;
      color: #333;
      transition: all 0.2s ease-in-out;
    }

    .box:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .input-section {
      display: flex;
      gap: 10px;
    }

    #nameInput {
      flex: 1;
      padding: 12px 14px;
      font-size: 15px;
      border: 1.5px solid #ccc;
      border-radius: 6px;
      outline: none;
    }

    #nameInput:focus {
      border-color: #007bff;
    }

    #greetBtn {
      padding: 12px 20px;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      background-color: #007bff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    #greetBtn:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header with "Hello" initially -->
    <h1 id="greetingHeader">Hello</h1>

    <!-- 4 Boxes -->
    <div class="boxes-grid">
      <div class="box" data-color="red">red</div>
      <div class="box" data-color="blue">blue</div>
      <div class="box" data-color="green">green</div>
      <div class="box" data-color="yellow">yellow</div>
    </div>

    <!-- Input and Greet Button -->
    <div class="input-section">
      <input type="text" id="nameInput" placeholder="Enter your name" />
      <button id="greetBtn">Greet</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
